<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>j1hed | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Overlay Screen -->
    <div id="overlay" onclick="enterSite()">
        <div class="diamond">◆</div>
        <p class="enter-text"> ENTER</p>
        <span class="sub-text">[ J1HED ]</span>
    </div>

    <!-- Main Content Grid -->
    <div class="container">
        
        <!-- Profile Card -->
        <div class="card profile-card">
            <div class="avatar-box">
                <img src="avatar.png" alt="j1hed Avatar" class="avatar">
                <span class="badge">22;18</span>
            </div>
            <div class="profile-info">
                <h2>j1hed</h2>
                <div class="socials">
                    <a href="https://github.com/dead-jihed22" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://discord.com/users/j1hed." target="_blank"><i class="fab fa-discord"></i></a>
                    <a href="https://www.tiktok.com/@j1hed2218?is_from_webapp=1&sender_device=pc" target="_blank"><i class="fab fa-tiktok"></i></a>
                    <a href="https://open.spotify.com/user/31e5sluusbkoo4aomjqi6mj7yswu?si=a-Zhg_XqS_Gbq3mg6mj--w" target="_blank"><i class="fab fa-spotify"></i></a>
                </div>
                <div class="code-line"><code>while(true) { code(); }</code></div>
            </div>
        </div>

        <!-- Discord Status Card -->
        <div class="card status-card">
            <div class="card-title">● DISCORD PRESENCE NODE</div>
            <div class="status-content">
                <div class="user">
                    <span class="status-dot"></span>
                    <strong>j1hed</strong>
                </div>
                <p class="status-text">STATUS // Do Not Disturb</p>
                <!-- Clickable Link To Stop Music and Open Shop -->
                <a href="javascript:void(0)" onclick="openShopAndStopMusic()" class="discord-link">\ J1hed Shop /</a>
            </div>
        </div>

        <!-- Music Player Card (He Like Me) -->
        <div class="card player-card">
            <div class="song-info">
                <div class="icon-box">+</div>
                <span> He Like Me </span>
            </div>
            <audio id="bg-music" loop preload="auto">
                <source src="song.mp3" type="audio/mpeg">
            </audio>
            <button onclick="toggleMusic()" id="play-btn"><i class="fas fa-play"></i></button>
        </div>

        <!-- Code Block Card -->
        <div class="card code-card">
            <div class="code-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="file-name"> >_ J1HED.TS</span>
            </div>
            <pre><code><span class="keyword">const</span> message: <span class="type">string</span> = <span class="string">" Incomparable "</span>;</code></pre>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
      function toggleMusic() {
        const bgMusic = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-btn");

        if (bgMusic.paused) {
          bgMusic.play().then(() => {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
          }).catch(e => console.log("Audio playback error:", e));
        } else {
          bgMusic.pause();
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
      }

      function openShopAndStopMusic() {
        const bgMusic = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-btn");

        // Wa9ef el-musique w rajja3 l-button l-icon Play
        if (bgMusic) {
          bgMusic.pause();
        }
        if (playBtn) {
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        // 7ell el-Shop fi Tab jdid
        window.open("https://dead-jihed.github.io/Shop/", "_blank");
      }
    </script>
</body>
</html>
